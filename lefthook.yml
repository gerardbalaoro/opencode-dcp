pre-commit:
    piped: true
    jobs:
        - name: format
          glob: "{*.{js,jsx,ts,tsx,json,jsonc,md,mdx,yml,yaml},**/*.{js,jsx,ts,tsx,json,jsonc,md,mdx,yml,yaml}}"
          run: bun run format --write {staged_files}
          stage_fixed: true
        - name: lint
          glob: "{*.{ts,tsx,mts,cts},**/*.{ts,tsx,mts,cts}}"
          run: bun run lint --fix {staged_files}
          stage_fixed: true
        - name: generate schema
          glob: "src/lib/config.ts"
          run: bun run schema:generate && bun run format --write dcp.schema.json
