name: PR Checks

on:
    pull_request:
        branches: [master, dev]

jobs:
    validate:
        name: Type Check, Build & Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Format check
              run: bun run format:check

            - name: Schema check
              run: bun run schema:check

            - name: Type check
              run: bun run typecheck

            - name: Tests
              run: bun run test

            - name: Package check
              run: bun run check:package

            - name: Security audit
              run: npm audit --no-package-lock --audit-level=high
              continue-on-error: false
