name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Create release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            sha: ${{ steps.release.outputs.sha }}
        steps:
            - name: Release Please
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ github.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  target-branch: main

    publish:
        name: Publish to npm
        needs: release
        if: needs.release.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout release
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release.outputs.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  registry-url: https://registry.npmjs.org

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Format check
              run: bun run format:check

            - name: Schema check
              run: bun run schema:check

            - name: Type check
              run: bun run typecheck

            - name: Tests
              run: bun run test

            - name: Check npm version
              id: package
              run: |
                  NAME=$(node -p "require('./package.json').name")
                  VERSION=$(node -p "require('./package.json').version")
                  echo "name=${NAME}" >> "$GITHUB_OUTPUT"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

                  if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                      echo "published=true" >> "$GITHUB_OUTPUT"
                      echo "${NAME}@${VERSION} is already published."
                  else
                      echo "published=false" >> "$GITHUB_OUTPUT"
                      echo "${NAME}@${VERSION} is not published yet."
                  fi

            - name: Skip npm publish
              if: steps.package.outputs.published == 'true'
              run: echo "Skipping npm publish because ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published."

            - name: Publish
              if: steps.package.outputs.published == 'false'
              run: npx --yes --package npm@11 npm publish --access public --provenance
