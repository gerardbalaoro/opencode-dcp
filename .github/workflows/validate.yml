name: Validate

on:
    pull_request:
        branches: [main, dev]

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Check Format
              run: bun run format:check

            - name: Check Config Schema
              run: bun run schema:check

            - name: Check Types
              run: bun run typecheck

            - name: Run Tests
              run: bun run test

            - name: Build Package
              run: bun run build

            - name: Security Audit
              run: npm audit --no-package-lock --audit-level=high
              continue-on-error: false
